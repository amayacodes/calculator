<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JavaScript Calculator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      color: #222;
      margin: 40px;
    }

    h1 {
      color: #2c3e50;
    }

    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px 0 40px 0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px 14px;
      text-align: center;
    }

    th {
      background-color: #2c3e50;
      color: white;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #e8f0fe;
    }

    .error {
      color: #c0392b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Simple JavaScript Calculator</h1>
  <p>This page uses <code>calculator.js</code> to repeatedly prompt the user for two numbers
     and an operator, then displays the results in a table below.</p>

  <!-- All calculator logic lives in calculator.js -->
  <script src="calculator.js"></script>

</body>
</html>
