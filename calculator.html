<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JavaScript Calculator</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(135deg, #ffe4f1 0%, #ffd1e8 50%, #ffc2e0 100%);
      color: #7a2c52;
      margin: 40px;
    }

    h1 {
      color: #d6336c;
      text-shadow: 1px 1px 0 #fff, 2px 2px 4px rgba(214, 51, 108, 0.25);
    }

    h2 {
      color: #e05a95;
    }

    p code {
      background-color: #ffd6ec;
      padding: 2px 6px;
      border-radius: 6px;
      color: #b3336b;
    }

    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px 0 40px 0;
      background-color: #fff0f6;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(214, 51, 108, 0.25);
    }

    th, td {
      border: 1px solid #ffc2dd;
      padding: 12px 16px;
      text-align: center;
    }

    th {
      background-color: #f7699a;
      color: white;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #ffe6f2;
    }

    tr:hover {
      background-color: #ffccdf;
    }

    .error {
      color: #c0264d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Simple JavaScript Calculator</h1>
  <p>This page uses <code>calculator.js</code> to repeatedly prompt the user for two numbers
     and an operator, then displays the results in a table below.</p>

  <!-- All calculator logic lives in calculator.js -->
  <script src="calculator.js"></script>

</body>
</html>
